services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crashline
      POSTGRES_PASSWORD: crashline
      POSTGRES_DB: crashline
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - crashline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crashline"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crashline_pg:
